name: update

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: update-sync-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        branch: [unpatched, patched]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Auto-Update Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          python3 << 'EOF'
          import os, sys, re, json, urllib.request, subprocess
          from pathlib import Path

          target = os.environ.get('TARGET_BRANCH', 'unpatched').strip()

          def rpm_split(v):
              return [int(x) if x.isdigit() else x for x in re.split(r'(\d+)', v) if x and x not in '.~-']

          def vercmp(v1, v2):
              s1, s2 = rpm_split(v1), rpm_split(v2)
              for a, b in zip(s1, s2):
                  if type(a) != type(b):
                      return -1 if isinstance(a, str) else 1
                  if a != b:
                      return -1 if a < b else 1
              return -1 if len(s1) < len(s2) else (1 if len(s1) > len(s2) else 0)

          def query_upstream(pkg, names):
              for name in names:
                  urls = [
                      f'https://release-monitoring.org/api/v2/projects/?name={name}',
                      f'https://release-monitoring.org/api/v2/packages/?name={name}&distribution=Fedora'
                  ]
                  for url in urls:
                      try:
                          req = urllib.request.Request(url, headers={'User-Agent': 'fedora-autoupdater'})
                          with urllib.request.urlopen(req, timeout=10) as resp:
                              data = json.loads(resp.read().decode())
                              items = data.get('items', [])
                              if items and 'version' in items[0]:
                                  return items[0]['version'].strip()
                      except Exception as e:
                          print(f"Warning: query failed for {url}: {e}")
              return None

          spec_files = sorted(list(Path('.').glob('*/*.spec')))
          if not spec_files:
              print(f"No spec files found on branch {target}. Exiting.")
              sys.exit(0)

          updated_pkgs = []
          spec_map = {}

          for spec_path in spec_files:
              content = spec_path.read_text(encoding='utf-8')
              pkg_name = spec_path.parent.name
              spec_map[pkg_name] = spec_path

              m_ver = re.search(r'^Version:\s*([^\s]+)', content, re.MULTILINE)
              if not m_ver:
                  continue
              cur_ver = m_ver.group(1).strip()

              names_to_try = [pkg_name]
              m_upstream = re.search(r'^#\s*(?:upstream|anitya):\s*([^\s]+)', content, re.MULTILINE)
              if m_upstream:
                  names_to_try.insert(0, m_upstream.group(1).strip())
              m_url = re.search(r'^URL:\s*https?://github\.com/[^/]+/([^/\s]+)', content, re.MULTILINE)
              if m_url and m_url.group(1) not in names_to_try:
                  names_to_try.append(m_url.group(1).strip())

              new_ver = query_upstream(pkg_name, names_to_try)
              if not new_ver:
                  print(f"[{pkg_name}] Current version: {cur_ver}. Upstream version not found.")
                  continue

              if re.search(r'-(?:dev|alpha|beta|rc)', new_ver, re.I) and not re.search(r'~(?:dev|alpha|beta|rc)', cur_ver, re.I):
                  print(f"[{pkg_name}] Skipping pre-release/dev version {new_ver}.")
                  continue

              sanitized_ver = new_ver.replace('-', '~')

              if vercmp(cur_ver, sanitized_ver) < 0:
                  print(f"[{pkg_name}] Updating from {cur_ver} -> {sanitized_ver}")
                  content = re.sub(r'^(Version:\s*).*$', rf'\g<1>{sanitized_ver}', content, flags=re.MULTILINE)
                  if not re.search(r'^Release:\s*%autorelease', content, re.MULTILINE):
                      content = re.sub(r'^(Release:\s*).*$', r'\g<1>1%{?dist}', content, flags=re.MULTILINE)

                  if '%changelog' in content:
                      content = re.sub(r'%changelog.*$', '%changelog\n%autochangelog\n', content, flags=re.DOTALL)
                  else:
                      content = content.rstrip() + '\n\n%changelog\n%autochangelog\n'

                  spec_path.write_text(content, encoding='utf-8')
                  updated_pkgs.append(pkg_name)
              else:
                  print(f"[{pkg_name}] Up to date ({cur_ver}).")

          if not updated_pkgs:
              print("No updates detected.")
              sys.exit(0)

          subprocess.run(['git', 'config', 'user.name', 'Ali Utku Çakır'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'aliutkucakir17@gmail.com'], check=True)
          repo_url = f"https://x-access-token:{os.environ['GH_TOKEN']}@github.com/{os.environ['GITHUB_REPOSITORY']}.git"
          subprocess.run(['git', 'remote', 'set-url', 'origin', repo_url], check=True)

          for pkg in updated_pkgs:
              subprocess.run(['git', 'add', str(spec_map[pkg])], check=True)

          msg = f"chore: auto-update {', '.join(updated_pkgs)} ({target}) [skip ci]"
          subprocess.run(['git', 'commit', '-m', msg], check=True)

          pushed = False
          for _ in range(3):
              res = subprocess.run(['git', 'push', 'origin', f"HEAD:{target}"], capture_output=True, text=True)
              if res.returncode == 0:
                  pushed = True
                  break
              subprocess.run(['git', 'pull', '--rebase', 'origin', target], check=False)

          if not pushed:
              raise RuntimeError(f"Could not push to {target} after retries")

          print(f"Updates pushed to {target}. Delegating synchronized build dispatch to push.yml...")
          subprocess.run(['gh', 'workflow', 'run', 'push.yml', '-f', f'branch={target}', '-f', 'package=all'], check=False)
          EOF
